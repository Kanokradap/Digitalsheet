<body class="bg-sky-50 min-h-screen">

  <script type="text/babel">
    const { useState } = React;
    
    // Pure React Native SVG Icon Component (Prevents DOM mutation conflicts)

      const iconProps = {
        className,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      };

      switch (name) {
        case "shield-check":
          return (
            <svg {...iconProps}>
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

          );
        case "book-open":
          return (

              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>

          return (

          );
        case "chevron-left":
          return (

              <path d="m15 18-6-6 6-6"/>

          );
        case "user-check":
          return (

          );
        case "message-square":
          return (
            <svg {...iconProps}>
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

          );
        case "alert-triangle":
          return (
            <svg {...iconProps}>
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          );
        case "clock":
          return (
            <svg {...iconProps}>
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          );
        case "check-circle":
          return (
            <svg {...iconProps}>
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          );
        case "help-circle":
          return (
            <svg {...iconProps}>
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          );
        case "award":
          return (
            <svg {...iconProps}>
              <circle cx="12" cy="8" r="7"/>
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
            </svg>
          );
        case "lock":
          return (
            <svg {...iconProps}>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          );
        case "search":
          return (
            <svg {...iconProps}>
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          );
        case "refresh-cw":
          return (
            <svg {...iconProps}>
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          );
        default:
          return null;
      }
    };

    function App() {
      // Student Info State
      const [studentInfo, setStudentInfo] = useState({ name: '', grade: 'ป.4', room: '', number: '' });
      const [isStarted, setIsStarted] = useState(false);
      const [currentStep, setCurrentStep] = useState(1);
      const [isCompleted, setIsCompleted] = useState(false);

      // Stats
      const [hintCount, setHintCount] = useState(0);

      // Worksheets State & User Answers
      const [answers, setAnswers] = useState({
        q1: { selected: [], reason: '' },
        q2: { shareable: [], privateData: [], reason: '' },
        q3: { action: '', reason: '', advisor: '' },
        q4: { matched: {} },
        q5: { sequence: [1, 2, 3, 4, 5] },
        q6: { reply: '', impact: '' },
        q7: { choice: '', reason: '', fillIn: '' },
        q8: { change1: '', change2: '', change3: '', reason: '' },
        q9: { adviceA: '', adviceB: '', adviceC: '' },
        q10: { rule1: '', rule2: '', rule3: '', slogan: '', reflection: '' }
      });

      // Check state & Hint System
      const [quizStatus, setQuizStatus] = useState({
        1: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        2: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        3: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        4: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        5: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        6: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        7: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        8: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        9: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 },
        10: { attempted: false, errors: 0, isPassed: false, hintLevel: 0 }
      });

      const totalSteps = 10;

      // Q1 setup
      const q1Items = [
        { id: 'ต้น', text: 'ต้น: ขออนุญาตเพื่อนก่อนนำรูปไปโพสต์', isGood: true },
        { id: 'น้ำ', text: 'น้ำ: แชร์ข่าวทันทีโดยไม่ตรวจสอบ', isGood: false },
        { id: 'ฟ้า', text: 'ฟ้า: บอกรหัสผ่านให้เพื่อน', isGood: false },
        { id: 'บอล', text: 'บอล: พบเพื่อนถูกล้อในกลุ่มแชต จึงแจ้งครู', isGood: true }
      ];

      // Q2 setup
      const q2Items = [
        { id: 'ชื่อเล่น', text: 'ชื่อเล่น', type: 'shareable' },
        { id: 'รหัสผ่าน', text: 'รหัสผ่าน', type: 'private' },
        { id: 'ที่อยู่บ้าน', text: 'ที่อยู่บ้าน', type: 'private' },
        { id: 'งานอดิเรก', text: 'งานอดิเรก', type: 'shareable' },
        { id: 'เบอร์โทรศัพท์', text: 'เบอร์โทรศัพท์', type: 'private' },
        { id: 'รูปอาหาร', text: 'รูปอาหารที่ชอบ', type: 'shareable' },
        { id: 'เลขบัตรประชาชน', text: 'เลขบัตรประชาชน', type: 'private' },
        { id: 'ชื่อโรงเรียน', text: 'ชื่อโรงเรียน', type: 'shareable' }
      ];

      // Q4 setup
      const q4Pairs = [
        { id: 'p1', question: 'พบข่าวที่น่าสงสัย', answer: 'ตรวจสอบข้อมูลก่อนแชร์' },
        { id: 'p2', question: 'เพื่อนถูกล้อในกลุ่มแชต', answer: 'ไม่ร่วมล้อและแจ้งผู้ใหญ่' },
        { id: 'p3', question: 'มีคนขอรหัสผ่าน', answer: 'ไม่เปิดเผยรหัสผ่าน' },
        { id: 'p4', question: 'ต้องการโพสต์รูปเพื่อน', answer: 'ขออนุญาตก่อนโพสต์' },
        { id: 'p5', question: 'ใช้โทรศัพท์จนดึก', answer: 'ลดเวลาใช้งานและพักผ่อน' }
      ];

      // Q5 setup items
      const q5StepsData = [
        { id: 1, text: 'หยุดและไม่กดลิงก์' },
        { id: 2, text: 'ตรวจสอบข้อมูล' },
        { id: 3, text: 'ไม่ส่งต่อให้เพื่อน' },
        { id: 4, text: 'ขอคำแนะนำจากครูหรือผู้ปกครอง' },
        { id: 5, text: 'แจ้งผู้เกี่ยวข้องเมื่อพบสิ่งผิดปกติ' }
      ];

      // Handle Drag & Drop utilities for Q1 & Q2
      const handleDropQ1 = (id) => {
        if (!answers.q1.selected.includes(id)) {
          setAnswers({
            ...answers,
            q1: { ...answers.q1, selected: [...answers.q1.selected, id] }
          });
        }
      };

      const removeItemQ1 = (id) => {
        setAnswers({
          ...answers,
          q1: { ...answers.q1, selected: answers.q1.selected.filter(item => item !== id) }
        });
      };

      const handleDropQ2 = (item, target) => {
        let newShareable = answers.q2.shareable.filter(i => i.id !== item.id);
        let newPrivate = answers.q2.privateData.filter(i => i.id !== item.id);

        if (target === 'shareable') {
          newShareable.push(item);
        } else if (target === 'private') {
          newPrivate.push(item);
        }

        setAnswers({
          ...answers,
          q2: {
            ...answers.q2,
            shareable: newShareable,
            privateData: newPrivate
          }
        });
      };

      // Checking Validation Handlers
      const checkAnswer = (step) => {
        let passed = false;
        let errors = quizStatus[step].errors;
        let hintLvl = quizStatus[step].hintLevel;

        if (step === 1) {
          const correctChars = ['ต้น', 'บอล'];
          const hasCorrectChars = answers.q1.selected.length === 2 && answers.q1.selected.every(c => correctChars.includes(c));
          const hasReason = answers.q1.reason.trim().length >= 5;
          passed = hasCorrectChars && hasReason;
        } 
        else if (step === 2) {
          const correctShareable = ['ชื่อเล่น', 'งานอดิเรก', 'รูปอาหาร', 'ชื่อโรงเรียน'];
          const correctPrivate = ['รหัสผ่าน', 'ที่อยู่บ้าน', 'เบอร์โทรศัพท์', 'เลขบัตรประชาชน'];
          
          const isShareableCorrect = answers.q2.shareable.length === 4 && answers.q2.shareable.every(i => correctShareable.includes(i.id));
          const isPrivateCorrect = answers.q2.privateData.length === 4 && answers.q2.privateData.every(i => correctPrivate.includes(i.id));
          const hasReason = answers.q2.reason.trim().length >= 5;
          
          passed = isShareableCorrect && isPrivateCorrect && hasReason;
        }
        else if (step === 3) {
          const hasAction = answers.q3.action.trim().length >= 3;
          const hasReason = answers.q3.reason.trim().length >= 3;
          const hasAdvisor = answers.q3.advisor.trim().length >= 2;
          passed = hasAction && hasReason && hasAdvisor;
        }
        else if (step === 4) {
          const totalMatched = Object.keys(answers.q4.matched).length;
          if (totalMatched === 5) {
            let allCorrect = true;
            q4Pairs.forEach(p => {
              if (answers.q4.matched[p.id] !== p.answer) allCorrect = false;
            });
            passed = allCorrect;
          }
        }
        else if (step === 5) {
          const seq = answers.q5.sequence;
          passed = seq[0] === 1 && answers.q5.sequence.length === 5;
        }
        else if (step === 6) {
          const replyOk = answers.q6.reply.trim().length >= 5;
          const impactOk = answers.q6.impact.trim().length >= 5;
          passed = replyOk && impactOk;
        }
        else if (step === 7) {
          const choiceOk = answers.q7.choice !== '';
          const reasonOk = answers.q7.reason.trim().length >= 5;
          const fillOk = answers.q7.fillIn.trim().length >= 3;
          passed = choiceOk && reasonOk && fillOk;
        }
        else if (step === 8) {
          const c1 = answers.q8.change1.trim().length >= 3;
          const c2 = answers.q8.change2.trim().length >= 3;
          const c3 = answers.q8.change3.trim().length >= 3;
          const r = answers.q8.reason.trim().length >= 5;
          passed = c1 && c2 && c3 && r;
        }
        else if (step === 9) {
          const a = answers.q9.adviceA.trim().length >= 5;
          const b = answers.q9.adviceB.trim().length >= 5;
          const c = answers.q9.adviceC.trim().length >= 5;
          passed = a && b && c;
        }
        else if (step === 10) {
          const r1 = answers.q10.rule1.trim().length >= 3;
          const r2 = answers.q10.rule2.trim().length >= 3;
          const r3 = answers.q10.rule3.trim().length >= 3;
          const s = answers.q10.slogan.trim().length >= 3;
          const ref = answers.q10.reflection.trim().length >= 5;
          passed = r1 && r2 && r3 && s && ref;
        }

        if (!passed) {
          errors += 1;
          hintLvl = Math.min(hintLvl + 1, 3);
          setHintCount(prev => prev + 1);
        }

        setQuizStatus({
          ...quizStatus,
          [step]: {
            attempted: true,
            errors: errors,
            isPassed: passed,
            hintLevel: hintLvl
          }
        });
      };

      const nextStep = () => {
        if (currentStep < totalSteps) {
          setCurrentStep(currentStep + 1);
        } else {
          setIsCompleted(true);
        }
      };

      const prevStep = () => {
        if (currentStep > 1) {
          setCurrentStep(currentStep - 1);
        }
      };

      const renderHint = (step) => {
        const status = quizStatus[step];
        if (!status.attempted || status.isPassed) return null;

        const hints = {
          1: [
            "ลองพิจารณาว่าใครปฏิบัติตนโดยเคารพผู้อื่น หรือแจ้งผู้ใหญ่เมื่อพบปัญหา",
            "สังเกตพฤติกรรม: การแชร์ข่าวทันที หรือบอกรหัสผ่านให้คนอื่น เป็นสิ่งที่ไม่ปลอดภัยนะจ๊ะ!",
            "คำตอบคือ 'ต้น' (ขออนุญาตก่อนโพสต์) และ 'บอล' (แจ้งครูเมื่อเพื่อนถูกล้อ) อย่าลืมเขียนเหตุผลสั้น ๆ ด้วยนะ"
          ],
          2: [
            "ลองคิดดูว่า ข้อมูลใดสามารถใช้ระบุตัวเราได้ และหากผู้อื่นนำไปใช้ อาจทำให้เราไม่ปลอดภัย",
            "ข้อมูล เช่น รหัสผ่าน ที่อยู่ เบอร์โทร เลขบัตรประชาชน เป็นข้อมูลส่วนตัวมากๆ ไม่ควรแชร์นะ",
            "จัดหมวดหมู่ให้ครบ 8 ข้อ และพิมพ์บอกเหตุผลเพิ่มเติมอีกนิดหน่อยนะเด็ก ๆ"
          ],
          3: [
            "หากคนแปลกหน้ามาขอข้อมูลส่วนตัวพร้อมเสนอของรางวัล เราควรปฏิเสธหรือปรึกษาใครดี?",
            "อย่าลืมว่าชื่อ ที่อยู่ เบอร์โทรศัพท์ คือข้อมูลส่วนตัวที่ไม่ควรให้คนแปลกหน้าเด็ดขาด",
            "ตอบปฏิเสธ ไม่ให้ข้อมูล และบอกผู้ปกครองหรือคุณครูเพื่อขอคำปรึกษา"
          ],
          4: [
            "อ่านสถานการณ์ฝั่งซ้าย แล้วเลือกลากข้อความฝั่งขวามาจับคู่ให้ตรงกันนะ",
            "สังเกตคำสำคัญ เช่น 'ข่าวสงสัย' -> 'ตรวจสอบ', 'โพสต์รูป' -> 'ขออนุญาต'",
            "จับคู่ให้ครบทั้ง 5 ข้อ เพื่อให้สามารถตรวจคำตอบได้ถูกต้องนะ"
          ],
          5: [
            "สิ่งแรกสุดที่คุณควรทำเมื่อเจอลิงก์แปลกๆ คืออะไร? (กดหยุดทันทีไหมนะ?)",
            "ขั้นที่ 1 ควรเป็น 'หยุดและไม่กดลิงก์' จากนั้นจึงตรวจสอบและแจ้งผู้ปกครอง",
            "จัดเรียงโดยให้ลำดับแรกคือ 'หยุดและไม่กดลิงก์' แล้วเรียงขั้นตอนถัดไปอย่างมีเหตุผล"
          ],
          6: [
            "นึกถึงจิตใจของเพื่อน หากมีคนเอารูปไปโพสต์ล้อเลียน เพื่อนจะรู้สึกอย่างไร?",
            "การเป็นพลเมืองดิจิทัลที่ดี ต้องหยุดยั้งการกลั่นแกล้ง (Cyberbullying) และเคารพสิทธิผู้อื่น",
            "พิมพ์คำตอบแนะนำให้หยุดการกระทำ และอธิบายผลกระทบที่มีต่อความรู้สึกและสิทธิของเพื่อน"
          ],
          7: [
            "ข้อความที่ส่งต่อกันมา โดยไม่มีแหล่งอ้างอิงชัดเจน เราควรเชื่อทันทีเลยไหม?",
            "โรงเรียนจะหยุดหรือไม่ ต้องรอประกาศอย่างเป็นทางการจากทางโรงเรียนหรือคุณครูเท่านั้น",
            "เลือก 'ยังไม่เชื่อและไม่แชร์' พร้อมเขียนเหตุผลและเติมคำว่า 'ตรวจสอบความถูกต้อง' ในช่องว่าง"
          ],
          8: [
            "ลองเปลี่ยนการเล่นโทรศัพท์ดึกๆ มาเป็นการกำหนดเวลาพักผ่อนให้เพียงพอสิ",
            "การแบ่งเวลาให้กับการเรียน การนอนหลับ และการพักสายตา จะช่วยให้สุขภาพเราดีขึ้น",
            "กรอกข้อเสนอแนะเปลี่ยนพฤติกรรมให้ครบทั้ง 3 ช่อง และบอกเหตุผลว่าทำไมต้องควบคุมเวลา"
          ],
          9: [
            "คิดถึงหลักการ: เก็บความลับ (รหัสผ่าน), ชัวร์ก่อนแชร์, และช่วยเหลือเมื่อเพื่อนถูกกลั่นแกล้ง",
            "ใช้คำพูดที่สุภาพและแนะนำวิธีที่ปลอดภัยให้กับเพื่อนในทั้ง 3 สถานการณ์",
            "พิมพ์คำแนะนำสั้นๆ แต่ตรงประเด็นให้ครบทั้งสถานการณ์ A, B และ C"
          ],

                              placeholder="ฉันจะ ขออนุญาตเพื่อนก่อนโพสต์รูป..."
                              value={answers.q10.rule2}
                              onChange={(e) => setAnswers({ ...answers, q10: { ...answers.q10, rule2: e.target.value } })}
                              className="w-full p-2 rounded-xl border-none text-slate-800 text-sm focus:outline-none bg-white"
                            />
                          </div>
                          <div className="flex items-center gap-2 bg-white/10 p-2 rounded-2xl backdrop-blur-sm">
                            <span className="font-bold text-xs shrink-0">กฎข้อที่ 3:</span>
                            <input 
                              type="text" 
                              placeholder="ฉันจะ ตรวจสอบข่าวสารก่อนแชร์ต่อ..."
                              value={answers.q10.rule3}
                              onChange={(e) => setAnswers({ ...answers, q10: { ...answers.q10, rule3: e.target.value } })}
                              className="w-full p-2 rounded-xl border-none text-slate-800 text-sm focus:outline-none bg-white"
                            />
                          </div>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">
                          สโลแกนสั้น ๆ ของฉัน:
                        </label>
                        <div className="flex items-center gap-2 text-sm font-bold text-slate-800">
                          <span className="shrink-0">“พลเมืองดิจิทัลที่ดี คือ</span>
                          <input 
                            type="text" 
                            placeholder="ผู้ที่ใช้อินเทอร์เน็ตอย่างปลอดภัยและเคารพผู้อื่น"
                            value={answers.q10.slogan}
                            onChange={(e) => setAnswers({ ...answers, q10: { ...answers.q10, slogan: e.target.value } })}
                            className="w-full p-2.5 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-500 text-sm"
                          />
                          <span className="shrink-0">”</span>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">
                          สะท้อนความคิด: หลังจากเรียนเรื่องนี้ สิ่งหนึ่งที่ฉันจะนำไปใช้ในชีวิตประจำวันคืออะไร?
                        </label>
                        <textarea 
                          rows={2}
                          placeholder="เช่น จะแบ่งเวลาเล่นเกม และไม่แชร์ข้อมูลส่วนตัว..."
                          value={answers.q10.reflection}
                          onChange={(e) => setAnswers({ ...answers, q10: { ...answers.q10, reflection: e.target.value } })}
                          className="w-full p-3 rounded-2xl border-2 border-slate-200 focus:border-sky-400 focus:outline-none text-sm"
                        />
                      </div>
                    </div>
                  )}

                  {/* Hint & Feedback Render Area */}
                  {renderHint(currentStep)}
                  {renderFeedback(currentStep)}

                  {/* Controls Footer inside Card */}
                  <div className="mt-8 pt-4 border-t border-slate-100 flex flex-wrap gap-3 justify-between items-center">
                    <button
                      onClick={prevStep}
                      disabled={currentStep === 1}
                      className={`px-4 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-1 transition-all ${
                        currentStep === 1 
                          ? 'bg-slate-100 text-slate-300 cursor-not-allowed' 
                          : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }`}
                    >
                      <Icon name="chevron-left" className="w-4 h-4" />
                      <span>ก่อนหน้า</span>
                    </button>

                    <div className="flex gap-2">
                      <button
                        onClick={() => checkAnswer(currentStep)}
                        className="px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-2xl shadow-md transition-all text-sm flex items-center gap-1"
                      >
                        <Icon name="check-circle" className="w-4 h-4" />
                        <span>ตรวจคำตอบ</span>
                      </button>

                      <button
                        onClick={nextStep}
                        disabled={!quizStatus[currentStep].isPassed}
                        className={`px-6 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-1 shadow-md transition-all ${
                          quizStatus[currentStep].isPassed 
                            ? 'bg-sky-500 hover:bg-sky-600 text-white shadow-sky-200' 
                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        }`}
                      >
                        <span>{currentStep === totalSteps ? 'สรุปผลใบงาน' : 'ถัดไป'}</span>
                        <Icon name="chevron-right" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            ) : (
              /* COMPLETION SUMMARY PAGE */
              <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-emerald-200 text-center max-w-2xl mx-auto space-y-6">
                <div className="inline-block p-4 bg-emerald-100 rounded-full text-emerald-600">
                  <Icon name="award" className="w-16 h-16 mx-auto" />
                </div>

                <div>
                  <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">
                    🎉 ทำใบงานเสร็จแล้ว!
                  </h2>
                  <p className="text-slate-600 text-sm mt-1">
                    ยินดีด้วยนะ <span className="font-bold text-slate-800">{studentInfo.name}</span> ชั้น {studentInfo.grade} {studentInfo.room}
                  </p>
                </div>

                {/* Summary Stats */}
                <div className="grid grid-cols-2 gap-4 bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100">
                  <div className="p-3 bg-white rounded-xl shadow-sm">
                    <span className="text-xs text-slate-500 font-bold block">ข้อที่ทำสำเร็จ</span>
                    <span className="text-2xl font-black text-emerald-600">10 / 10</span>
                  </div>
                  <div className="p-3 bg-white rounded-xl shadow-sm">
                    <span className="text-xs text-slate-500 font-bold block">จำนวนครั้งที่ขอคำใบ้</span>
                    <span className="text-2xl font-black text-amber-500">{hintCount} ครั้ง</span>
                  </div>
                </div>

                {/* Badges / Strengths */}
                <div className="text-left space-y-2">
                  <h4 className="font-bold text-slate-700 text-sm">🌟 จุดเด่นการเรียนรู้ที่คุณทำได้สำเร็จ:</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs font-bold">
                    <div className="p-2.5 bg-sky-50 text-sky-800 rounded-xl flex items-center gap-2 border border-sky-100">
                      <Icon name="lock" className="w-4 h-4 text-sky-600 shrink-0" />
                      <span>🔐 ปกป้องข้อมูลส่วนตัว</span>
                    </div>
                    <div className="p-2.5 bg-indigo-50 text-indigo-800 rounded-xl flex items-center gap-2 border border-indigo-100">
                      <Icon name="user-check" className="w-4 h-4 text-indigo-600 shrink-0" />
                      <span>🤝 เคารพสิทธิผู้อื่น</span>
                    </div>
                    <div className="p-2.5 bg-purple-50 text-purple-800 rounded-xl flex items-center gap-2 border border-purple-100">
                      <Icon name="search" className="w-4 h-4 text-purple-600 shrink-0" />
                      <span>🔎 รู้เท่าทันข้อมูลข่าวสาร</span>
                    </div>
                    <div className="p-2.5 bg-emerald-50 text-emerald-800 rounded-xl flex items-center gap-2 border border-emerald-100">
                      <Icon name="shield-check" className="w-4 h-4 text-emerald-600 shrink-0" />
                      <span>🛡️ ใช้เทคโนโลยีอย่างปลอดภัย</span>
                    </div>
                  </div>
                </div>

                {/* Final Pledge */}
                <div className="p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl text-amber-900 font-extrabold text-base">
                  “ฉันพร้อมเป็นพลเมืองดิจิทัลที่ดี”
                </div>

                <button 
                  onClick={() => {
                    setIsStarted(false);
                    setIsCompleted(false);
                    setCurrentStep(1);
                  }}
                  className="px-6 py-3 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-2xl shadow-md transition-all text-sm inline-flex items-center gap-2"
                >
                  <Icon name="refresh-cw" className="w-4 h-4" />
                  <span>ทำใบงานใหม่อีกครั้ง</span>
                </button>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
            <p>ใบงานออนไลน์ Interactive เรื่อง พลเมืองดิจิทัล | สำหรับการจัดการเรียนรู้วิทยาการคำนวณ ป.4</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
